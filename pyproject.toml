[project]
name = "trackflow-services"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "tinydb>=4.8,<5.0",
    "email-validator>=2.2,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
    "python-jose[cryptography]>=3.5.0",
    "libpass[bcrypt]>=1.9.3",
    "resend>=2.48,<3.0",
]

[project.scripts]
seed = "services.api.seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# importlib permite nombres de módulo repetidos entre subcarpetas de tests/.
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["services/api", "packages/shared"]

[tool.coverage.report]
show_missing = true
skip_empty = true
