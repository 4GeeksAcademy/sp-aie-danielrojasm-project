[project]
name = "trackflow-services"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "tinydb>=4.8,<5.0",
    "email-validator>=2.2,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
    "python-jose[cryptography]>=3.5.0",
    "libpass[bcrypt]>=1.9.3",
    "resend>=2.48,<3.0",
    "sqlmodel>=0.0.47",
    "psycopg2-binary>=2.9.13",
    "pandas>=3.0.6",
    "prefect>=3",
    "python-dotenv>=1.2.3",
    "celery[redis]>=5.5",
    "flower>=2.0",
    "scikit-learn>=1.9.1",
    "matplotlib>=3.11.2",
    "scipy>=1.17.1",
    "qdrant-client>=1.15",
    "openai>=1.100",
    "langgraph>=1.2.12",
    "httpx>=0.28",
    "fastmcp>=3.4,<4",
    "mcpauth==0.2.0b1",
    "langchain-mcp-adapters>=0.3.2",
    "redis>=6.4.0",
]

[project.scripts]
seed = "services.api.seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*"]

[dependency-groups]
dev = [
    "fakeredis>=2.39.0",
    "httpx2>=2.13.1",
    "jsonschema>=4.23",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# importlib permite nombres de módulo repetidos entre subcarpetas de tests/.
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["services/api", "services/telemetry", "services/reporting", "services/jobs", "data/pipelines", "data/process", "packages/shared"]

[tool.coverage.report]
show_missing = true
skip_empty = true
