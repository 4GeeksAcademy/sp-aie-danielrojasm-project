# Entorno de desarrollo de TrackFlow: `docker compose up` desde la raíz.
# Toda la configuración sale de `.env` (copia de `.env.example`); aquí no hay
# valores de entorno ni secretos escritos a mano.

services:
  api:
    build:
      context: ./services
    env_file:
      - .env
    environment:
      # El backoffice del contenedor escucha en 3001 (en local, en 3002).
      BACKOFFICE_ORIGIN: ${DOCKER_BACKOFFICE_ORIGIN:?Falta DOCKER_BACKOFFICE_ORIGIN en .env}
      PASSWORD_RESET_URL: ${DOCKER_PASSWORD_RESET_URL:?Falta DOCKER_PASSWORD_RESET_URL en .env}
      # La API solo encola: mismo Redis que el worker, por nombre de servicio.
      REDIS_URL: ${DOCKER_REDIS_URL:?Falta DOCKER_REDIS_URL en .env}
      # Base de conocimiento comercial (RAG): Qdrant por nombre de servicio.
      QDRANT_URL: ${DOCKER_QDRANT_URL:?Falta DOCKER_QDRANT_URL en .env}
    ports:
      - "8000:8000"
    volumes:
      - ./services:/app/services
      - ./packages:/app/packages:ro
      # Pipeline semanal: `services/reporting` importa el flow de `data/pipelines`.
      - ./data:/app/data
      # Allowlist de propiedades de cada evento de telemetría.
      - ./docs/telemetry:/app/docs/telemetry:ro
    networks:
      - trackflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  # Base vectorial del RAG (colección `trackflow_knowledge`). La indexa
  # `data/process/rag.py` (`setup()`); la API solo consulta.
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      # Sin API key: solo accesible desde esta máquina.
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - trackflow

  # Proveedor OAuth 2.1 / OIDC del servidor MCP (`mcps/trackflow_tools`). Importa
  # el realm `trackflow` (scopes y clientes) en cada arranque; sin volumen: el
  # realm del repo es la única fuente de verdad. `KC_HOSTNAME` fija el issuer de
  # los tokens (`KEYCLOAK_URL`, el mismo que valida el servidor MCP).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?Falta KEYCLOAK_ADMIN_USER en .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Falta KEYCLOAK_ADMIN_PASSWORD en .env}
      KC_HOSTNAME: ${KEYCLOAK_URL:?Falta KEYCLOAK_URL en .env}
      KC_HTTP_PORT: "8080"
      KEYCLOAK_AGENT_CLIENT_SECRET: ${KEYCLOAK_AGENT_CLIENT_SECRET:?Falta KEYCLOAK_AGENT_CLIENT_SECRET en .env}
      KEYCLOAK_OPERATOR_CLIENT_SECRET: ${KEYCLOAK_OPERATOR_CLIENT_SECRET:?Falta KEYCLOAK_OPERATOR_CLIENT_SECRET en .env}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    networks:
      - trackflow

  # Broker y result backend de Celery. `noeviction`: con la memoria llena Redis
  # rechaza escrituras en vez de borrar mensajes de la cola. AOF para que los
  # mensajes encolados sobrevivan a un reinicio del contenedor.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      # Sin contraseña: solo accesible desde esta máquina.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - trackflow
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Worker de Celery (`services/tasks/`): proceso aparte de la API. Consume la cola
  # `default` (pipeline semanal) y `dead_letter` (registro de tareas agotadas).
  # `docker compose stop worker` hace un warm shutdown: termina la tarea en curso;
  # si no le da tiempo, el mensaje sin ACK vuelve a la cola.
  worker:
    build:
      context: ./services
    command:
      ["celery", "-A", "services.tasks.celery_app", "worker", "--loglevel=INFO",
       "--queues=default,dead_letter", "--concurrency=2", "--hostname=worker@%h"]
    env_file:
      - .env
    environment:
      REDIS_URL: ${DOCKER_REDIS_URL:?Falta DOCKER_REDIS_URL en .env}
    stop_grace_period: 2m
    volumes:
      - ./services:/app/services:ro
      # El worker ejecuta el flow de `data/pipelines` (resultados de Prefect en `data/raw/`).
      - ./data:/app/data
    networks:
      - trackflow
    depends_on:
      redis:
        condition: service_healthy

  # Monitor de la cola (solo desarrollo): http://localhost:5555
  flower:
    build:
      context: ./services
    command: ["celery", "-A", "services.tasks.celery_app", "flower", "--port=5555"]
    env_file:
      - .env
    environment:
      REDIS_URL: ${DOCKER_REDIS_URL:?Falta DOCKER_REDIS_URL en .env}
    ports:
      # Sin autenticación: solo accesible desde esta máquina.
      - "127.0.0.1:5555:5555"
    volumes:
      - ./services:/app/services:ro
      - ./data:/app/data:ro
    networks:
      - trackflow
    depends_on:
      redis:
        condition: service_healthy

  # Cron de los jobs nocturnos (`infra/scheduler/crontab`): proceso aparte de la
  # API, que nunca ejecuta jobs en su hilo. Solo necesita la base de datos.
  scheduler:
    build:
      context: ./services
      dockerfile: ../infra/scheduler/Dockerfile
    env_file:
      - .env
    volumes:
      - ./services:/app/services:ro
      - ./scripts:/app/scripts:ro
      # Código del pipeline y destino del CSV (`data/raw/telemetry_YYYY-MM-DD.csv`).
      - ./data:/app/data
      - ./infra/scheduler/crontab:/app/infra/scheduler/crontab:ro
    networks:
      - trackflow

  uis:
    build:
      context: ./uis
    command: ["sh", "./start.sh"]
    init: true
    # Solo las URLs que necesita Next: los secretos de la API no entran aquí.
    environment:
      TRACKFLOW_API_INTERNAL_URL: ${TRACKFLOW_API_INTERNAL_URL:?Falta TRACKFLOW_API_INTERNAL_URL en .env}
      NEXT_PUBLIC_INVENTORY_API_URL: ${NEXT_PUBLIC_INVENTORY_API_URL:?Falta NEXT_PUBLIC_INVENTORY_API_URL en .env}
      # Del .env raíz; si falta, la ruta del propio backoffice (rewrite /api/telemetry/* hacia la API).
      NEXT_PUBLIC_TELEMETRY_ENDPOINT: ${NEXT_PUBLIC_TELEMETRY_ENDPOINT:-/api/telemetry/events}
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - ./uis:/app/uis
      # El backoffice importa la lógica del Hito 2 desde <raíz>/src.
      - ./src:/app/src:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      # Volúmenes anónimos: el bind mount no tapa las dependencias ni la caché
      # de Next instaladas en la imagen (binarios de Alpine, no del host).
      - /app/uis/website/node_modules
      - /app/uis/website/.next
      - /app/uis/backoffice/node_modules
      - /app/uis/backoffice/.next
    depends_on:
      api:
        condition: service_healthy
    networks:
      - trackflow

networks:
  trackflow:
    name: trackflow-dev

volumes:
  redis-data:
  qdrant-data:
